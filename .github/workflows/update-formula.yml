# Moves the formula to a release of denrou/slack: rewrites it, installs and
# tests it, then commits. The Release workflow of denrou/slack dispatches it
# once the archives are published; by hand:
#
#   gh workflow run update-formula.yml --repo denrou/homebrew-slack

name: Update Formula

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release of denrou/slack, without the v (default: the latest)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  update:
    # macOS rather than Linux: the formula ships a binary, and the macOS one
    # is the one in use, so it is the one to install and test here.
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v7

      - run: ./update "$VERSION"
        env:
          VERSION: ${{ inputs.version }}

      # brew reads formulae from taps only, so the checkout becomes one.
      - name: Register the checkout as the denrou/slack tap
        run: |
          taps="$(brew --repository)/Library/Taps/denrou"
          mkdir -p "$taps"
          ln -s "$GITHUB_WORKSPACE" "$taps/homebrew-slack"

      - run: brew audit --strict denrou/slack/slack

      - run: brew install --verbose denrou/slack/slack

      - run: brew test --verbose denrou/slack/slack

      - name: Commit and push if changed
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- Formula/slack.rb; then
            echo "The formula already described that release."
            exit 0
          fi
          version="$(sed -n 's|.*/releases/download/v\([^/]*\)/.*|\1|p' Formula/slack.rb | head -n 1)"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -am "Update slack to ${version}"
          # Explicit token and refspec, as in the other denrou taps: a plain
          # push had no credentials there once the checkout was a tap.
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin HEAD:main
